<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Black background -->
  <rect width="100" height="100" fill="#000"/>
  <!-- Orange outer frame -->
  <rect x="8" y="8" width="84" height="84" fill="none" stroke="#ff4500" stroke-width="5"/>
  <!-- Orange notches -->
  <rect x="20" y="5" width="16" height="8" fill="#ff4500"/>
  <rect x="64" y="5" width="16" height="8" fill="#ff4500"/>
  <rect x="20" y="87" width="16" height="8" fill="#ff4500"/>
  <rect x="64" y="87" width="16" height="8" fill="#ff4500"/>
  <rect x="5" y="20" width="8" height="16" fill="#ff4500"/>
  <rect x="5" y="64" width="8" height="16" fill="#ff4500"/>
  <rect x="87" y="20" width="8" height="16" fill="#ff4500"/>
  <rect x="87" y="64" width="8" height="16" fill="#ff4500"/>
  <!-- Salmon circle -->
  <circle cx="50" cy="50" r="28" fill="#f07060"/>
  <!-- White diagonal slash -->
  <line x1="28" y1="28" x2="72" y2="72" stroke="white" stroke-width="10" stroke-linecap="round"/>
</svg>
