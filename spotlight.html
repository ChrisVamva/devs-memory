<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Dev's Memory Search</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      * { margin:0; padding:0; box-sizing:border-box; }
      body {
        font-family: 'Caveat', cursive;
        background: transparent;
        color: #2c2416;
        height: 100vh;
        overflow: hidden;
      }
      .wrap {
        background: #faf7f0;
        border: 1.5px solid #c9bfa8;
        border-radius: 12px;
        box-shadow: 0 16px 48px rgba(0,0,0,0.28);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      .search-row {
        display: flex;
        align-items: center;
        padding: 10px 14px;
        border-bottom: 1px solid #c9bfa8;
        gap: 8px;
      }
      .search-icon { font-size: 16px; opacity: 0.5; }
      input {
        flex: 1;
        border: none;
        outline: none;
        font-family: 'Caveat', cursive;
        font-size: 18px;
        background: transparent;
        color: #2c2416;
      }
      input::placeholder { color: #b0a090; }
      .results { flex: 1; overflow-y: auto; padding: 6px 0; }
      .result-item {
        padding: 7px 14px;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        gap: 2px;
        border-left: 3px solid transparent;
      }
      .result-item:hover, .result-item.active {
        background: #f0ebe0;
        border-left-color: #7a5c3a;
      }
      .result-label {
        font-size: 15px;
        font-weight: 600;
        color: #3d2e1a;
      }
      .result-value {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        color: #7a5c3a;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .result-cat {
        font-size: 11px;
        color: #b0a090;
      }
      .empty {
        padding: 20px;
        text-align: center;
        color: #b0a090;
        font-size: 15px;
      }
      .hint {
        padding: 6px 14px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        color: #b0a090;
        border-top: 1px solid #ede8dc;
        display: flex;
        gap: 12px;
      }
      .copied-toast {
        position: fixed;
        bottom: 36px;
        left: 50%;
        transform: translateX(-50%);
        background: #7a5c3a;
        color: #faf7f0;
        padding: 4px 16px;
        border-radius: 20px;
        font-size: 13px;
        opacity: 0;
        transition: opacity 0.2s;
        pointer-events: none;
      }
      .copied-toast.show { opacity: 1; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="search-row">
        <span class="search-icon">🔍</span>
        <input id="search" placeholder="Search commands..." autofocus />
      </div>
      <div class="results" id="results"></div>
      <div class="hint">
        <span>↑↓ navigate</span>
        <span>↵ copy</span>
        <span>Esc close</span>
      </div>
    </div>
    <div class="copied-toast" id="toast">Copied!</div>

    <script>
      let allCommands = []
      let filtered    = []
      let activeIdx   = 0

      window.addEventListener('message', e => {
        if (e.data?.type === 'data') {
          allCommands = e.data.commands
          render(allCommands)
        }
      })

      // Request data from main
      window.electronSpotlight?.requestData()

      const input   = document.getElementById('search')
      const results = document.getElementById('results')
      const toast   = document.getElementById('toast')

      input.addEventListener('input', () => {
        const q = input.value.toLowerCase().trim()
        filtered = q
          ? allCommands.filter(c =>
              c.label.toLowerCase().includes(q) ||
              c.value.toLowerCase().includes(q) ||
              c.category.toLowerCase().includes(q)
            )
          : allCommands
        activeIdx = 0
        render(filtered)
      })

      document.addEventListener('keydown', e => {
        if (e.key === 'Escape') { window.electronSpotlight?.close(); return }
        if (e.key === 'ArrowDown') { activeIdx = Math.min(activeIdx + 1, filtered.length - 1); render(filtered); return }
        if (e.key === 'ArrowUp')   { activeIdx = Math.max(activeIdx - 1, 0); render(filtered); return }
        if (e.key === 'Enter' && filtered[activeIdx]) copyItem(filtered[activeIdx])
      })

      function copyItem(item) {
        navigator.clipboard.writeText(item.value)
        toast.classList.add('show')
        setTimeout(() => { toast.classList.remove('show'); window.electronSpotlight?.close() }, 800)
      }

      function render(list) {
        if (!list.length) {
          results.innerHTML = '<div class="empty">No commands found</div>'
          return
        }
        results.innerHTML = list.map((item, i) => `
          <div class="result-item ${i === activeIdx ? 'active' : ''}" data-idx="${i}">
            <div style="display:flex;justify-content:space-between;align-items:baseline">
              <span class="result-label">${item.label}</span>
              <span class="result-cat">${item.category}</span>
            </div>
            <span class="result-value">${item.value}</span>
          </div>
        `).join('')

        results.querySelectorAll('.result-item').forEach(el => {
          el.addEventListener('click', () => copyItem(list[+el.dataset.idx]))
          el.addEventListener('mouseenter', () => { activeIdx = +el.dataset.idx; render(list) })
        })

        const active = results.querySelector('.active')
        if (active) active.scrollIntoView({ block: 'nearest' })
      }

      render(allCommands)
    </script>
  </body>
</html>
